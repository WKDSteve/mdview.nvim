# .github/workflows/native.yml
# The non-Lua checks of mdview.nvim, hand-written (the Lua part is the generated ci.yml, from ci.workflow in
# .testing.lua; testing.nvim's generator has no Go/Rust setup and no tag trigger):
# - Rust: cargo tests (incl. XSS-neutralization checks) + wasm-pack build,
#   shared with the Node job via an artifact
# - Node/TypeScript: install, lint, type-check, test, build client
# - Go: vet, build, test the relay server
# - Browser e2e (Playwright) against the built relay and client bundle
# - Release (tag pushes only): cross-compile the relay server, package the
#   client bundle, publish both to a GitHub Release for mdview.nvim's
#   install.lua to download
# Runs on the check branches of `testing ci land` (ci/**) as well, but land waits for ci.yml only: a red run here
# does not hold main back.

name: native

on:
  push:
    branches: [ main, 'ci/**' ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  rust:
    name: Rust / WASM render module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/wasm-render/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/wasm-render/Cargo.lock') }}

      - name: Run cargo tests (incl. XSS-neutralization checks)
        working-directory: native/wasm-render
        run: cargo test

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        working-directory: native/wasm-render
        run: wasm-pack build --target web --out-dir ../../src/client/wasm-render

      - name: Upload WASM render module
        uses: actions/upload-artifact@v7
        with:
          name: wasm-render-pkg
          path: src/client/wasm-render

  node:
    name: Node.js / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rust
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The WASM render module (built by the rust job) must be present before
      # type-checking and unit tests: src/client/main.ts imports it, and it's a
      # gitignored build artifact, so without it tsc/vitest fail with TS2307.
      - name: Download WASM render module
        uses: actions/download-artifact@v8
        with:
          name: wasm-render-pkg
          path: src/client/wasm-render

      - name: Lint (TypeScript / JS)
        run: npm run lint

      - name: Type-check client
        run: npm run check:types

      - name: Run unit tests
        run: npm test

      - name: Build client
        run: npm run build:client

  go:
    name: Go relay server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # `cache-dependency-path` explicitly: the action's own module-cache
      # lookup defaults to the repo root, which has no go.sum -- it lives
      # under native/server/ alongside go-version-file. Without this the
      # cache silently never hits and every run re-downloads every module.
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/server/go.mod
          cache-dependency-path: native/server/go.sum

      - name: Vet
        working-directory: native/server
        run: go vet ./...

      - name: Build
        working-directory: native/server
        run: go build ./...

      - name: Test (incl. auth/origin/room-isolation checks)
        working-directory: native/server
        run: go test ./...

  browser:
    # TESTS/browser/*.e2e.mjs (cursor-line band and its corner cases, TOC anchor jump, spotlight mirror, keycast overlay) in a real chromium (needs the relay binary and the
    # client bundle, so it builds both like the release job). Exit 77 of the script would be a skip, not a green run.
    name: Browser e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: native/server/go.mod
          cache-dependency-path: native/server/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: npm ci

      - name: Build client bundle and relay
        run: |
          npm run build
          npm run build:go

      - name: Install chromium (the pinned Playwright version)
        run: npx playwright-core install --with-deps chromium

      - name: Browser e2e (band, band cases, anchor jump, spotlight mirror, keycast)
        run: |
          set +e
          npm run test:browser
          code=$?
          # 77 = a prerequisite is missing: on CI everything is built above, so that is a failure here
          exit $code

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-e2e-screenshots
          path: TESTS/browser/out
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release (tag push only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, node, go]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: native/server/go.mod
          cache-dependency-path: native/server/go.sum

      - name: Cross-compile mdview-server binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=publish --config .goreleaser.yml
          workdir: native/server

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: npm ci

      - name: Build client bundle (WASM + HTML/JS)
        run: npm run build

      - name: Package client bundle
        run: tar -czf mdview-client.tar.gz -C dist/client .

      - name: Stage release assets under their public download names
        # GoReleaser's local "binary" format archives land in per-target
        # subdirectories (e.g. .goreleaser-dist/mdview-server_linux_amd64_v1/mdview-server)
        # named differently from the final asset name it uses when actually
        # publishing. artifacts.json has the authoritative name -> path
        # mapping (entries with extra.Format == "binary"); use that instead
        # of guessing paths, so install.lua's downloads always match exactly
        # what checksums.txt and the release assets are named.
        run: |
          mkdir -p release-assets
          # artifacts.json's `path` is relative to the goreleaser workdir
          # (native/server), but this step runs from the repo root — prefix it.
          jq -r '.[] | select(.extra.Format == "binary") | "\(.path)\t\(.name)"' \
            native/server/.goreleaser-dist/artifacts.json |
          while IFS=$'\t' read -r path name; do
            cp "native/server/$path" "release-assets/$name"
          done
          cp native/server/.goreleaser-dist/checksums.txt release-assets/checksums.txt
          cp mdview-client.tar.gz release-assets/mdview-client.tar.gz

      - name: Append client bundle checksum to the binaries' checksums.txt
        working-directory: release-assets
        run: sha256sum mdview-client.tar.gz >> checksums.txt

      - name: Publish GitHub release with all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
